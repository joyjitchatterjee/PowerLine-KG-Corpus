name: Validate release
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/validate_release.py
      - run: python ontology/validate_graph.py
      - run: python ontology/load_annotations.py --dry-run
      - run: python -m unittest discover -s tests
      - run: pip install cffconvert==2.0.0
      - run: cffconvert --validate
  graph:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci-only-disposable-password
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget --quiet --spider http://localhost:7474 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      NEO4J_PASSWORD: ci-only-disposable-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python ontology/load_ontology.py --quiet
      - run: python ontology/load_annotations.py
      - run: python ontology/load_annotations.py
      - run: python ontology/validate_graph.py --live
      - run: python ontology/load_annotations.py --verify
